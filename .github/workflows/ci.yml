name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: Label files carry a clock and only human decisions
        run: autonomy-gate lint examples/leads_history.jsonl examples/leads_heldout.jsonl examples/leads_live_labels.jsonl
      - name: Test
        run: pytest

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install detect-secrets==1.5.0
      - name: Scan tracked files
        run: git ls-files -z | xargs -0 detect-secrets-hook --baseline .secrets.baseline
